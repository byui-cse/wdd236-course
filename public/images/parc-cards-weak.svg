<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="340" height="200" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="170" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Weak Alignment</text>
  
  <!-- Card 1 - slightly off -->
  <rect x="15" y="45" width="80" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
  <rect x="20" y="50" width="70" height="40" fill="#ddd" rx="2"/>
  <text x="25" y="100" font-size="10" font-weight="bold" fill="#333">Title</text>
  <text x="25" y="115" font-size="8" fill="#666">Description text</text>
  <rect x="20" y="125" width="50" height="15" fill="#0066cc" rx="2"/>
  <text x="45" y="134" font-size="8" font-weight="bold" text-anchor="middle" fill="white">Btn</text>
  
  <!-- Card 2 - more offset -->
  <rect x="115" y="50" width="80" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
  <rect x="130" y="55" width="55" height="35" fill="#ddd" rx="2"/>
  <text x="135" y="103" font-size="10" font-weight="bold" fill="#333">Title</text>
  <text x="120" y="118" font-size="8" fill="#666">Description</text>
  <rect x="135" y="128" width="40" height="15" fill="#0066cc" rx="2"/>
  <text x="155" y="137" font-size="8" font-weight="bold" text-anchor="middle" fill="white">Btn</text>
  
  <!-- Card 3 - different again -->
  <rect x="215" y="42" width="80" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
  <rect x="225" y="48" width="60" height="38" fill="#ddd" rx="2"/>
  <text x="230" y="100" font-size="10" font-weight="bold" fill="#333">Title</text>
  <text x="225" y="113" font-size="8" fill="#666">Desc text here</text>
  <rect x="230" y="125" width="55" height="15" fill="#0066cc" rx="2"/>
  <text x="257.5" y="134" font-size="8" font-weight="bold" text-anchor="middle" fill="white">Button</text>
</svg>