<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="160" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Weak Repetition</text>
  
  <!-- Primary button -->
  <text x="20" y="60" font-size="11" fill="#666">Primary Button:</text>
  <rect x="20" y="65" width="70" height="20" fill="#0066cc" stroke="none" rx="2"/>
  <text x="55" y="78" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Button</text>
  <text x="100" y="78" font-size="10" fill="#999">12px, pad 10px</text>
  
  <!-- Secondary button -->
  <text x="20" y="120" font-size="11" fill="#666">Secondary Button:</text>
  <rect x="20" y="125" width="75" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="2"/>
  <text x="57.5" y="140" font-size="13" text-anchor="middle" fill="#333">Button</text>
  <text x="110" y="140" font-size="10" fill="#999">14px, pad 12px</text>
  
  <!-- Link that acts like button -->
  <text x="20" y="180" font-size="11" fill="#666">Link Button:</text>
  <text x="20" y="195" font-size="11" fill="#0066cc" text-decoration="underline">Click here</text>
  <text x="85" y="195" font-size="10" fill="#999">11px, underline</text>
</svg>