<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="240" fill="#f5f5f5"/>
  
  <!-- Container -->
  <rect x="30" y="20" width="240" height="200" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  
  <!-- Title -->
  <text x="150" y="45" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Strong Contrast</text>
  
  <!-- Email field -->
  <text x="40" y="75" font-size="12" fill="#666">Email</text>
  <rect x="40" y="82" width="220" height="28" fill="#fff8f8" stroke="#dd0000" stroke-width="2" rx="2"/>
  
  <!-- Error message - highly visible -->
  <circle cx="48" cy="127" r="5" fill="#dd0000"/>
  <text x="60" y="131" font-size="12" font-weight="bold" fill="#dd0000">Invalid email address</text>
  
  <!-- Password field -->
  <text x="40" y="165" font-size="12" fill="#666">Password</text>
  <rect x="40" y="172" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
</svg>