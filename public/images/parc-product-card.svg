<svg viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="220" height="300" fill="#f5f5f5"/>
  
  <!-- Card -->
  <rect x="10" y="10" width="200" height="280" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
  
  <!-- Product Image -->
  <rect x="20" y="20" width="180" height="120" fill="#e8e8e8" rx="2"/>
  <text x="110" y="85" font-size="14" text-anchor="middle" fill="#999">[Product Image]</text>
  
  <!-- Divider -->
  <line x1="20" y1="150" x2="200" y2="150" stroke="#f0f0f0" stroke-width="1"/>
  
  <!-- Product Name -->
  <text x="20" y="175" font-size="14" font-weight="bold" fill="#333">Product Name</text>
  
  <!-- Price -->
  <text x="20" y="200" font-size="16" font-weight="bold" fill="#dd0000">$19.99</text>
  
  <!-- Rating -->
  <text x="20" y="225" font-size="12" fill="#ffaa00">★★★★★</text>
  <text x="85" y="225" font-size="11" fill="#999">(124)</text>
  
  <!-- Divider -->
  <line x1="20" y1="235" x2="200" y2="235" stroke="#f0f0f0" stroke-width="1"/>
  
  <!-- Add to Cart button -->
  <rect x="20" y="245" width="180" height="35" fill="#0066cc" stroke="none" rx="3"/>
  <text x="110" y="268" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Add to Cart</text>
  
  <!-- Save link -->
  <text x="110" y="285" font-size="11" text-anchor="middle" fill="#0066cc" text-decoration="underline">Save for Later</text>
</svg>