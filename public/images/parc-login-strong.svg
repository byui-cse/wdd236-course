<svg viewBox="0 0 300 270" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="270" fill="#f5f5f5"/>
  
  <!-- Container -->
  <rect x="30" y="20" width="240" height="230" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  
  <!-- Title -->
  <text x="150" y="45" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Strong Proximity</text>
  
  <!-- Grouped form fields -->
  <text x="40" y="75" font-size="12" fill="#666">Username</text>
  <rect x="40" y="82" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <text x="40" y="125" font-size="12" fill="#666">Password</text>
  <rect x="40" y="132" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <!-- Primary action button - prominent -->
  <rect x="100" y="180" width="100" height="36" fill="#0066cc" stroke="none" rx="3"/>
  <text x="150" y="203" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Login</text>
  
  <!-- Secondary link - clearly secondary -->
  <text x="150" y="235" font-size="11" text-anchor="middle" fill="#0066cc" text-decoration="underline">Forgot Password?</text>
</svg>