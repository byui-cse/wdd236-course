<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="220" fill="#f5f5f5"/>
  
  <!-- Container -->
  <rect x="30" y="20" width="240" height="180" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  
  <!-- Title -->
  <text x="150" y="45" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Weak Contrast</text>
  
  <!-- Email field -->
  <text x="40" y="75" font-size="12" fill="#666">Email</text>
  <rect x="40" y="82" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <!-- Error message - barely visible -->
  <text x="40" y="125" font-size="11" fill="#999">Invalid email address</text>
  
  <!-- Password field -->
  <text x="40" y="155" font-size="12" fill="#666">Password</text>
  <rect x="40" y="162" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
</svg>