<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="160" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Strong Repetition</text>
  
  <!-- Primary button -->
  <text x="20" y="60" font-size="11" fill="#666">Primary Button:</text>
  <rect x="20" y="65" width="80" height="24" fill="#0066cc" stroke="none" rx="3"/>
  <text x="60" y="82" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Button</text>
  <text x="110" y="82" font-size="10" fill="#999">12px, pad 10px</text>
  
  <!-- Secondary button -->
  <text x="20" y="120" font-size="11" fill="#666">Secondary Button:</text>
  <rect x="20" y="125" width="80" height="24" fill="white" stroke="#999" stroke-width="1" rx="3"/>
  <text x="60" y="142" font-size="12" text-anchor="middle" fill="#333">Button</text>
  <text x="110" y="142" font-size="10" fill="#999">12px, pad 10px</text>
  
  <!-- Tertiary link -->
  <text x="20" y="180" font-size="11" fill="#666">Tertiary Link:</text>
  <text x="20" y="195" font-size="12" fill="#666">Link text</text>
  <text x="80" y="195" font-size="10" fill="#999">hover: underline</text>
</svg>