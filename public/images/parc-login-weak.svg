<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="250" fill="#f5f5f5"/>
  
  <!-- Container -->
  <rect x="30" y="20" width="240" height="210" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  
  <!-- Title -->
  <text x="150" y="45" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Weak Proximity</text>
  
  <!-- Form fields - all equally spaced -->
  <text x="40" y="75" font-size="12" fill="#666">Username</text>
  <rect x="40" y="82" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <text x="40" y="130" font-size="12" fill="#666">Email</text>
  <rect x="40" y="137" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <text x="40" y="185" font-size="12" fill="#666">Password</text>
  <rect x="40" y="192" width="220" height="28" fill="white" stroke="#999" stroke-width="1" rx="2"/>
  
  <!-- Buttons - separated equally -->
  <rect x="40" y="235" width="100" height="28" fill="#0066cc" stroke="none" rx="2"/>
  <text x="90" y="253" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Login</text>
  
  <text x="160" y="253" font-size="12" fill="#0066cc">Forgot Password?</text>
</svg>