  <!-- Card 3 -->
  <rect x="215" y="45" width="80" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
  <rect x="220" y="50" width="70" height="35" fill="#ddd" rx="2"/>
  <text x="220" y="98" font-size="10" font-weight="bold" fill="#333">Title</text>
  <text x="220" y="113" font-size="8" fill="#666">Description</text>
  <rect x="220" y="125" width="70" height="15" fill="#0066cc" rx="2"/>
