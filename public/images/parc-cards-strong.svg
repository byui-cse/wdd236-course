<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="340" height="200" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="170" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Strong Alignment</text>
  
  <!-- Card 1 -->
  <rect x="15" y="45" width="80" height="100" fill="white" stroke="#ccc" stroke-width="1" rx="3"/>
